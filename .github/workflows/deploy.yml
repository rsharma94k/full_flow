name: CI/CD Pipeline

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    # --- STAGE 1: TEST ---
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "poetry"

            - name: Install dependencies
              run: poetry install --no-root

            - name: Run Tests
              # Using 'python -m' ensures 'main.py' is found in the path
              run: poetry run python -m pytest

    # --- STAGE 2: BUILD & SECURITY SCAN ---
    build-and-scan:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read
            security-events: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build Local Image for Scanning
              uses: docker/build-push-action@v5
              with:
                  context: .
                  # CRITICAL: This loads the image into the local Docker daemon for Snyk
                  load: true
                  tags: local-app-image:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Run Snyk to check Docker image
              uses: snyk/actions/docker@master
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              with:
                  image: local-app-image:latest
                  # --severity-threshold=high ensures we only block on major issues
                  args: --file=Dockerfile --severity-threshold=high

            - name: Tag and Push Verified Image to GHCR
              run: |
                  # Lowercase repo name for Docker naming conventions
                  REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  docker tag local-app-image:latest ghcr.io/$REPO_LOWER:latest
                  docker tag local-app-image:latest ghcr.io/$REPO_LOWER:${{ github.sha }}
                  docker push ghcr.io/$REPO_LOWER --all-tags

    # --- STAGE 3: DEPLOY ---
    deploy:
        needs: build-and-scan
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Render Deploy
              run: |
                  curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
