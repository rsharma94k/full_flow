name: CI/CD Pipeline

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    # --- STAGE 1: TEST ---
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Poetry
              run: pipx install poetry

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "poetry"

            - name: Install dependencies
              run: poetry install --no-root

            - name: Run Tests
              run: poetry run python -m pytest

    # --- STAGE 2: BUILD, SCAN, & PUSH ---
    build-and-deploy:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Install Snyk CLI
              run: |
                  curl https://static.snyk.io/cli/latest/snyk-linux -o snyk
                  chmod +x ./snyk
                  sudo mv ./snyk /usr/local/bin/snyk

            - name: Build Local Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  load: true # Pushes the image to the local Docker daemon
                  tags: local-app-image:latest

            - name: Snyk Container Scan
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              # We use '|| true' temporarily if you want to skip blocking on errors, 
              # but for now, we keep it strict to find the bug.
              run: snyk container test local-app-image:latest --severity-threshold=high

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag and Push Verified Image
              run: |
                  REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  docker tag local-app-image:latest ghcr.io/$REPO_LOWER:latest
                  docker push ghcr.io/$REPO_LOWER:latest

            - name: Trigger Render Deploy
              run: |
                  curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
