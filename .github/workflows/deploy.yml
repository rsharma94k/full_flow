name: CI/CD Pipeline

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Poetry
              run: pipx install poetry
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "poetry"
            - name: Install dependencies
              run: poetry install --no-root
            - name: Run Tests
              run: poetry run python -m pytest

    build-and-scan:
        needs: test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            packages: write
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # 1. Install Snyk CLI directly on the runner (More stable than the Docker Action)
            - name: Install Snyk CLI
              run: |
                  curl https://static.snyk.io/cli/latest/snyk-linux -o snyk
                  chmod +x ./snyk
                  sudo mv ./snyk /usr/local/bin/snyk

            - name: Build Local Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  load: true
                  tags: local-app-image:latest

            # 2. Run Snyk Scan using the CLI directly
            - name: Snyk Container Scan
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              run: |
                  snyk container test local-app-image:latest --file=Dockerfile --severity-threshold=high

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Tag and Push
              run: |
                  REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
                  docker tag local-app-image:latest ghcr.io/$REPO_LOWER:latest
                  docker push ghcr.io/$REPO_LOWER:latest

    deploy:
        needs: build-and-scan
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Render Deploy
              run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
